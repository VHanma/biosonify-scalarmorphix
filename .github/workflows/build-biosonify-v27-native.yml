name: Build BioSonify Crash Isolation APKs

on:
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - assets/**
      - components/**
      - constants/**
      - hooks/**
      - lib/**
      - scripts/**
      - app.config.ts
      - babel.config.js
      - metro.config.js
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - build_inputs/BioSonify-FIXED-TRIGGER.txt
      - .github/workflows/build-biosonify-v27-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-control:
    name: Baseline main control APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'

    steps:
      - name: Check out untouched main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'
          run_install: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check baseline
        run: pnpm run check

      - name: Generate native Android baseline
        run: pnpm exec expo prebuild --platform android --clean

      - name: Build ARM64 standalone baseline
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify and name baseline APK
        run: |
          set -euxo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" BioSonify-BASELINE-Control-ARM64.apk
          unzip -l BioSonify-BASELINE-Control-ARM64.apk | grep 'assets/index.android.bundle'
          unzip -l BioSonify-BASELINE-Control-ARM64.apk | grep 'lib/arm64-v8a/libreactnative.so'
          sha256sum BioSonify-BASELINE-Control-ARM64.apk > BioSonify-BASELINE-Control-ARM64-SHA256.txt

      - name: Upload baseline control
        uses: actions/upload-artifact@v4
        with:
          name: BioSonify-BASELINE-Control-ARM64
          path: |
            BioSonify-BASELINE-Control-ARM64.apk
            BioSonify-BASELINE-Control-ARM64-SHA256.txt
          if-no-files-found: error
          retention-days: 30

  musical-safe-boot:
    name: Musical branch safe-boot APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'

    steps:
      - name: Check out Musical branch
        uses: actions/checkout@v4
        with:
          ref: r3/erinspace-musical-sonify

      - name: Remove Musical route from startup for isolation
        run: |
          set -euxo pipefail
          mkdir -p diagnostic-disabled
          mv 'app/(tabs)/musical.tsx' diagnostic-disabled/musical.tsx.disabled
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/(tabs)/_layout.tsx')
          s = p.read_text()
          block = '''      <Tabs.Screen
                name="musical"
                options={{
                  title: "Musical",
                  tabBarIcon: ({ color }) => (
                    <IconSymbol size={24} name="music.note" color={color} />
                  ),
                }}
              />
          '''
          if block not in s:
              raise SystemExit('Musical tab block not found; refusing ambiguous diagnostic build')
          p.write_text(s.replace(block, '', 1))
          PY
          test ! -f 'app/(tabs)/musical.tsx'
          ! grep -q 'name="musical"' 'app/(tabs)/_layout.tsx'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'
          run_install: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check safe-boot source
        run: pnpm run check

      - name: Generate native Android safe-boot
        run: pnpm exec expo prebuild --platform android --clean

      - name: Build ARM64 standalone safe-boot
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify Musical code is absent from startup bundle
        run: |
          set -euxo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" BioSonify-MUSICAL-SafeBoot-ARM64.apk
          unzip -l BioSonify-MUSICAL-SafeBoot-ARM64.apk | grep 'assets/index.android.bundle'
          unzip -l BioSonify-MUSICAL-SafeBoot-ARM64.apk | grep 'lib/arm64-v8a/libreactnative.so'
          unzip -p BioSonify-MUSICAL-SafeBoot-ARM64.apk assets/index.android.bundle > /tmp/biosonify.bundle
          if grep -a -q 'ERINSPACE ENGINE' /tmp/biosonify.bundle; then
            echo 'Musical route unexpectedly remained in the startup bundle'
            exit 1
          fi
          sha256sum BioSonify-MUSICAL-SafeBoot-ARM64.apk > BioSonify-MUSICAL-SafeBoot-ARM64-SHA256.txt

      - name: Upload Musical safe-boot
        uses: actions/upload-artifact@v4
        with:
          name: BioSonify-MUSICAL-SafeBoot-ARM64
          path: |
            BioSonify-MUSICAL-SafeBoot-ARM64.apk
            BioSonify-MUSICAL-SafeBoot-ARM64-SHA256.txt
          if-no-files-found: error
          retention-days: 30
