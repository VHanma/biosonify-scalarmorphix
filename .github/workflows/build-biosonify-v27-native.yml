name: Build BioSonify Standalone Android APK

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - assets/**
      - components/**
      - constants/**
      - hooks/**
      - lib/**
      - scripts/**
      - app.config.ts
      - babel.config.js
      - metro.config.js
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - build_inputs/BioSonify-FIXED-TRIGGER.txt
      - .github/workflows/build-biosonify-v27-native.yml
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - assets/**
      - components/**
      - constants/**
      - hooks/**
      - lib/**
      - scripts/**
      - app.config.ts
      - babel.config.js
      - metro.config.js
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - build_inputs/BioSonify-FIXED-TRIGGER.txt
      - .github/workflows/build-biosonify-v27-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'

    steps:
      - name: Check out real BioSonify source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'
          run_install: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check application
        run: pnpm run check

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --clean

      # IMPORTANT: assembleDebug does not embed the Metro JS bundle. A debug APK
      # can install successfully and then fail immediately on a normal phone
      # without a development server. Release embeds the JS/assets and is the
      # correct one-click standalone package for direct installation.
      - name: Build standalone release APK with embedded JS
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify bundled standalone APK and hash it
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk BioSonify-STANDALONE-OneClick.apk
          sha256sum BioSonify-STANDALONE-OneClick.apk > BioSonify-STANDALONE-OneClick-SHA256.txt
          unzip -l BioSonify-STANDALONE-OneClick.apk | grep -E 'index.android.bundle|assets/.*bundle' || true

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: BioSonify-STANDALONE-OneClick
          path: |
            BioSonify-STANDALONE-OneClick.apk
            BioSonify-STANDALONE-OneClick-SHA256.txt
          if-no-files-found: error
          retention-days: 30
