name: Build Scalar Phase Forge APK

on:
  push:
    branches:
      - scalar-phase-forge-apk
    paths:
      - 'ScalarPhaseForge/**'
      - '.github/workflows/build-scalar-phase-forge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build standalone debug APK
        working-directory: ScalarPhaseForge
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp ScalarPhaseForge/app/build/outputs/apk/debug/app-debug.apk Scalar-Phase-Forge-v1.0.apk

      - name: Upload one-click APK
        uses: actions/upload-artifact@v4
        with:
          name: Scalar-Phase-Forge-v1.0-APK
          path: Scalar-Phase-Forge-v1.0.apk
          if-no-files-found: error
