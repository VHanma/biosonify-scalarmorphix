name: Build BioSonify Sealed Native V27 APK

on:
  pull_request:
    branches:
      - main
    paths:
      - build_inputs/BioSonify_COMPLETE_V27_ANDROID_PROJECT.zip.b64
      - .github/workflows/build-biosonify-v27-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-v27:
    name: Sealed native V27 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore sealed native Android project
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode build_inputs/BioSonify_COMPLETE_V27_ANDROID_PROJECT.zip.b64 > BioSonify_COMPLETE_V27_ANDROID_PROJECT.zip
          unzip -q BioSonify_COMPLETE_V27_ANDROID_PROJECT.zip
          test -d BioSonifyCloneAndroid
          test -f BioSonifyCloneAndroid/app/build.gradle

      - name: Build sealed native debug APK
        shell: bash
        run: |
          set -o pipefail
          cd BioSonifyCloneAndroid
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../biosonify-native-build.log

      - name: Verify and hash sealed APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=BioSonifyCloneAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" BioSonify-V27-SEALED-NATIVE.apk
          unzip -t BioSonify-V27-SEALED-NATIVE.apk >/dev/null
          sha256sum BioSonify-V27-SEALED-NATIVE.apk > BioSonify-V27-SEALED-NATIVE-SHA256.txt
          ls -lh BioSonify-V27-SEALED-NATIVE.apk

      - name: Upload sealed native APK
        uses: actions/upload-artifact@v4
        with:
          name: BioSonify-V27-SEALED-NATIVE
          path: |
            BioSonify-V27-SEALED-NATIVE.apk
            BioSonify-V27-SEALED-NATIVE-SHA256.txt
            biosonify-native-build.log
          if-no-files-found: error
          retention-days: 30
