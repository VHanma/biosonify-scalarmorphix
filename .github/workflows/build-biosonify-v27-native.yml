name: Build BioSonify Sealed Native V27 APK

on:
  pull_request:
    branches:
      - main
    paths:
      - build_inputs/BioSonify_COMPLETE_V27_ANDROID_PROJECT.zip.b64
      - .github/workflows/build-biosonify-v27-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-v27:
    name: Sealed native V27 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore intact sealed V27 through GitHub Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, os, re, urllib.request

          commit = '3098b2d0c1d85037a14e9cb5f63a1b4b51d95df0'
          path = 'build_inputs/BioSonify_COMPLETE_V27_ANDROID_PROJECT.zip.b64'
          url = f'https://api.github.com/repos/VHanma/biosonify-scalarmorphix/contents/{path}?ref={commit}'
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'BioSonify-V27-Recovery',
          })
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)

          if payload.get('encoding') != 'base64':
              raise SystemExit(f'Unexpected GitHub encoding: {payload.get("encoding")}')

          stored_text = base64.b64decode(payload['content'])
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', stored_text)
          clean += b'=' * ((4 - (len(clean) % 4)) % 4)
          decoded = base64.b64decode(clean, validate=False)
          print(f'GitHub reported size={payload.get("size")} text_bytes={len(stored_text)} zip_bytes={len(decoded)}')

          if not decoded.startswith(b'PK'):
              raise SystemExit('Decoded archive does not begin with ZIP PK signature')
          if b'PK\x05\x06' not in decoded[-65557:]:
              raise SystemExit('Decoded archive missing ZIP end-of-central-directory signature')

          Path('BioSonify_COMPLETE_V27_ANDROID_PROJECT.zip').write_bytes(decoded)
          PY
          unzip -t BioSonify_COMPLETE_V27_ANDROID_PROJECT.zip
          unzip -q BioSonify_COMPLETE_V27_ANDROID_PROJECT.zip
          test -d BioSonifyCloneAndroid
          test -f BioSonifyCloneAndroid/app/build.gradle
          test -f BioSonifyCloneAndroid/app/src/main/AndroidManifest.xml
          test -f BioSonifyCloneAndroid/app/src/main/java/com/biosonify/clone/MainActivity.java

      - name: Build sealed native debug APK
        shell: bash
        run: |
          set -o pipefail
          cd BioSonifyCloneAndroid
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../biosonify-native-build.log

      - name: Verify and hash sealed APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=BioSonifyCloneAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" BioSonify-V27-SEALED-NATIVE.apk
          unzip -t BioSonify-V27-SEALED-NATIVE.apk >/dev/null
          sha256sum BioSonify-V27-SEALED-NATIVE.apk > BioSonify-V27-SEALED-NATIVE-SHA256.txt
          ls -lh BioSonify-V27-SEALED-NATIVE.apk

      - name: Upload sealed native APK
        uses: actions/upload-artifact@v4
        with:
          name: BioSonify-V27-SEALED-NATIVE
          path: |
            BioSonify-V27-SEALED-NATIVE.apk
            BioSonify-V27-SEALED-NATIVE-SHA256.txt
            biosonify-native-build.log
          if-no-files-found: error
          retention-days: 30
