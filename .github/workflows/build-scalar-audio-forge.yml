name: Scalar Audio Forge APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scalar-audio-forge/**'
      - '.github/workflows/build-scalar-audio-forge.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Full-method + Combo Atlas regression tests
        run: gradle -p scalar-audio-forge :app:testDebugUnitTest --stacktrace
      - name: Compile installable APK
        run: gradle -p scalar-audio-forge :app:assembleDebug --stacktrace
      - name: Package APK + checksum
        run: |
          mkdir -p dist
          cp scalar-audio-forge/app/build/outputs/apk/debug/app-debug.apk dist/ScalarAudioForge-v1.3-debug.apk
          sha256sum dist/ScalarAudioForge-v1.3-debug.apk > dist/ScalarAudioForge-v1.3-debug.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScalarAudioForge-v1.3-debug
          path: dist/*
          if-no-files-found: error
