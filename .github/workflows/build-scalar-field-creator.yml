name: Build Launch-Tested Scalar Field Creator APK

on:
  pull_request:
    branches: [main]
    paths:
      - build_inputs/scalar-creator-v1.b64.part*
      - .github/workflows/build-scalar-field-creator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'
      APP_PACKAGE: com.vhanma.scalarfieldcreator
      MAIN_COMPONENT: com.vhanma.scalarfieldcreator/.MainActivity
      APK_FILE: Scalar-Field-Creator-OneClick.apk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct proven base and scalar-only overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
            build_inputs/image-identity-v2.b64.part00 \
            build_inputs/image-identity-v2.b64.part01 \
            build_inputs/image-identity-v2.b64.part02 \
            build_inputs/image-identity-v2.b64.part03 \
            build_inputs/image-identity-v2.b64.part04 \
            build_inputs/image-identity-v2.b64.part05 \
            build_inputs/image-identity-v2.b64.part06 \
            build_inputs/image-identity-v2.b64.part07 \
            build_inputs/image-identity-v2.b64.part08 \
            build_inputs/image-identity-v2.b64.part09 \
            build_inputs/image-identity-v2.b64.part10 \
            build_inputs/image-identity-v2.b64.part11 \
            build_inputs/image-identity-v2.b64.part12 \
            build_inputs/image-identity-v2.b64.part13 \
            build_inputs/image-identity-v2.b64.part14 \
            build_inputs/image-identity-v2.b64.part15 \
            build_inputs/image-identity-v2.b64.part16 \
            build_inputs/image-identity-v2.b64.part17 \
            > image-identity-source.b64
          python3 - <<'PY'
          from pathlib import Path
          p = Path('image-identity-source.b64')
          s = p.read_text()
          assert len(s) == 88259, len(s)
          s = s[:58383] + 't' + s[58383:]
          assert s[60980] == 'a', (60980, s[60980])
          s = s[:60980] + 'e' + s[60981:]
          assert s[69405] == 'C', (69405, s[69405])
          s = s[:69405] + 'K' + s[69406:]
          assert s[69407] == 'h', (69407, s[69407])
          s = s[:69407] + 'g' + s[69408:]
          assert len(s) == 88260, len(s)
          p.write_text(s)
          PY
          echo 'fddec40e3fff1d995855842d0d4c8cfb2f0c7cc7b6b4d72f72913387d8b8fe3e  image-identity-source.b64' | sha256sum -c -
          base64 -d image-identity-source.b64 > image-identity-source.zip
          echo 'c0516a6e84815644211be277ac687dee17600daeb7dd1408374c53b8ab0d5375  image-identity-source.zip' | sha256sum -c -
          unzip -t image-identity-source.zip | tee base-source-test.txt
          unzip -o image-identity-source.zip

          cat build_inputs/scalar-creator-v1.b64.part* > scalar-creator-overlay.b64
          echo 'b43da85e3828f2793719e23edf4730552f93b8e4fe7fe3176b93f8b1c8ef4073  scalar-creator-overlay.b64' | sha256sum -c -
          base64 -d scalar-creator-overlay.b64 > scalar-creator-overlay.zip
          echo '2c4645d809b9210812dd02feb00d04b96105fed202b614a2e9a425f8ae2766ad  scalar-creator-overlay.zip' | sha256sum -c -
          unzip -t scalar-creator-overlay.zip | tee scalar-overlay-test.txt
          unzip -o scalar-creator-overlay.zip

          test -f lib/scalar-signal-engine.ts
          test -f lib/scalar-master-notes.ts
          test -f components/scalar-field-visualizer.tsx
          test -f scripts/smoke-scalar-engine.ts
          grep -q 'com.vhanma.scalarfieldcreator' app.config.ts
          grep -q 'Scalar Field Creator' app.config.ts
          sha256sum image-identity-source.zip scalar-creator-overlay.zip > source-archives-SHA256.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'
          run_install: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install aligned Expo SDK 54 dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee pnpm-install.log
          test ${PIPESTATUS[0]} -eq 0
          pnpm exec expo install --fix 2>&1 | tee expo-install-fix.log
          test ${PIPESTATUS[0]} -eq 0
          pnpm install --no-frozen-lockfile 2>&1 | tee -a pnpm-install.log
          test ${PIPESTATUS[0]} -eq 0
          pnpm exec expo install --check 2>&1 | tee expo-dependency-check.txt || true
          cp package.json resolved-package.json

      - name: Prove scalar signal engine
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx scripts/smoke-scalar-engine.ts 2>&1 | tee scalar-engine-smoke.txt
          test ${PIPESTATUS[0]} -eq 0
          test "$(grep -c 'mode=.*valid=true' scalar-engine-smoke.txt)" -eq 8
          grep -q 'presets=12.*encoded_bits=24.*valid=true' scalar-engine-smoke.txt
          grep -q 'referenceNotice' lib/scalar-signal-engine.ts
          grep -q 'conventional audio and visual signal patterns' 'app/(tabs)/index.tsx'
          grep -q 'COMPLETE BUILT-IN REFERENCE' 'app/(tabs)/about.tsx'
          grep -q 'MASTER NOTES ON SCALAR ENERGY' lib/scalar-master-notes.ts

      - name: Generate and build Android release
        shell: bash
        run: |
          set -o pipefail
          pnpm exec expo prebuild --platform android --clean 2>&1 | tee prebuild.log
          test ${PIPESTATUS[0]} -eq 0
          grep -R "applicationId.*${APP_PACKAGE}" android/app/build.gradle
          grep '^reactNativeArchitectures=' android/gradle.properties | tee architecture-check.txt
          grep 'arm64-v8a' architecture-check.txt
          grep 'x86_64' architecture-check.txt
          chmod +x android/gradlew
          (cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace) 2>&1 | tee release-build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Verify package label signature and ABIs
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE" | tee apk-signature.txt
          "$AAPT" dump badging "$APK_FILE" | tee apk-badging.txt
          unzip -l "$APK_FILE" | tee apk-files.txt
          grep "package: name='${APP_PACKAGE}'" apk-badging.txt
          grep "application-label:'Scalar Field Creator'" apk-badging.txt
          grep 'lib/arm64-v8a/' apk-files.txt
          grep 'lib/x86_64/' apk-files.txt
          sha256sum "$APK_FILE" > Scalar-Field-Creator-OneClick-SHA256.txt

      - name: Boot Android 14 automation emulator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-34;aosp_atd;x86_64"
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name scalar_creator_test --package "system-images;android-34;aosp_atd;x86_64" --device "pixel_6"
          emulator -avd scalar_creator_test -no-window -noaudio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -memory 3072 > emulator-console.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 150); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 4
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell settings put global show_first_crash_dialog 0 || true
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true

      - name: Install launch and prove scalar-only UI
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          set +e
          adb install -r "$APK_FILE" > install-result.txt 2>&1; INSTALL_CODE=$?
          adb shell am force-stop "$APP_PACKAGE"
          adb logcat -c
          adb shell am start -W -S -n "$MAIN_COMPONENT" > activity-start-result.txt 2>&1; START_CODE=$?
          sleep 18
          adb shell pidof "$APP_PACKAGE" > process-id.txt 2>&1
          adb shell dumpsys activity activities > activity-state.txt 2>&1
          adb logcat -d -v threadtime > launch-log.txt 2>&1
          adb exec-out screencap -p > creator-screen.png 2>/dev/null
          FAILED=0
          [ "$INSTALL_CODE" -eq 0 ] || FAILED=1
          [ "$START_CODE" -eq 0 ] || FAILED=1
          [ -s process-id.txt ] || FAILED=1
          grep -E "mResumedActivity|topResumedActivity" activity-state.txt | grep "$APP_PACKAGE" || FAILED=1
          grep -E "FATAL EXCEPTION|Unable to start activity|Process: ${APP_PACKAGE}|ReactNativeJS:.*(TypeError|ReferenceError|Invariant Violation|Error:)" launch-log.txt && FAILED=1
          [ "$FAILED" -eq 0 ] || exit 1

          set -euo pipefail
          adb shell uiautomator dump /sdcard/creator-top.xml >/dev/null
          adb pull /sdcard/creator-top.xml creator-top.xml >/dev/null
          grep -q 'Scalar Field Creator' creator-top.xml
          grep -q 'Field Pair Mode' creator-top.xml

          SIZE="$(adb shell wm size | tail -1 | grep -oE '[0-9]+x[0-9]+')"
          WIDTH="${SIZE%x*}"; HEIGHT="${SIZE#*x}"; Y=$((HEIGHT - 115))
          cp creator-top.xml creator-ui.xml
          for I in 1 2 3 4 5 6 7 8; do
            adb shell input swipe "$((WIDTH / 2))" "$((HEIGHT * 3 / 4))" "$((WIDTH / 2))" "$((HEIGHT / 4))" 450
            sleep 2
            adb shell uiautomator dump "/sdcard/creator-${I}.xml" >/dev/null
            adb pull "/sdcard/creator-${I}.xml" "creator-${I}.xml" >/dev/null
            cat "creator-${I}.xml" >> creator-ui.xml
            test -n "$(adb shell pidof "$APP_PACKAGE" | tr -d '\r')"
          done
          grep -q 'Information Encoding' creator-ui.xml
          grep -q 'GENERATE SCALAR PATTERN' creator-ui.xml
          adb exec-out screencap -p > creator-bottom-screen.png 2>/dev/null

          adb shell input keyevent KEYCODE_MOVE_HOME || true
          sleep 2
          for PERCENT in 12 37 62 87 12; do
            adb shell input tap "$((WIDTH * PERCENT / 100))" "$Y"
            sleep 4
            test -n "$(adb shell pidof "$APP_PACKAGE" | tr -d '\r')"
          done
          adb shell dumpsys activity activities > navigation-activity-state.txt 2>&1
          adb logcat -d -v threadtime > navigation-log.txt 2>&1
          adb exec-out screencap -p > navigation-screen.png 2>/dev/null
          grep -E "mResumedActivity|topResumedActivity" navigation-activity-state.txt | grep "$APP_PACKAGE"
          ! grep -E "FATAL EXCEPTION|Unable to start activity|Process: ${APP_PACKAGE}|ReactNativeJS:.*(TypeError|ReferenceError|Invariant Violation|Error:)" navigation-log.txt

      - name: Upload proven APK
        uses: actions/upload-artifact@v4
        with:
          name: Scalar-Field-Creator-WORKING
          path: |
            Scalar-Field-Creator-OneClick.apk
            Scalar-Field-Creator-OneClick-SHA256.txt
            source-archives-SHA256.txt
            base-source-test.txt
            scalar-overlay-test.txt
            scalar-engine-smoke.txt
            apk-badging.txt
            apk-signature.txt
            apk-files.txt
            architecture-check.txt
            resolved-package.json
            release-build.log
            launch-log.txt
            navigation-log.txt
            creator-screen.png
            creator-bottom-screen.png
            navigation-screen.png
            creator-top.xml
            creator-*.xml
            creator-ui.xml
            activity-start-result.txt
            activity-state.txt
            navigation-activity-state.txt
            process-id.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Scalar-Field-Creator-Diagnostics
          path: |
            base-source-test.txt
            scalar-overlay-test.txt
            source-archives-SHA256.txt
            pnpm-install.log
            expo-install-fix.log
            expo-dependency-check.txt
            scalar-engine-smoke.txt
            prebuild.log
            release-build.log
            emulator-console.log
            install-result.txt
            activity-start-result.txt
            activity-state.txt
            navigation-activity-state.txt
            launch-log.txt
            navigation-log.txt
            creator-screen.png
            creator-bottom-screen.png
            navigation-screen.png
            creator-top.xml
            creator-*.xml
            creator-ui.xml
            process-id.txt
          if-no-files-found: ignore
          retention-days: 7
