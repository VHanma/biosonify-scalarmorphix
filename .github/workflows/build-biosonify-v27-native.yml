name: Build BioSonify Standalone Android APK

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - assets/**
      - components/**
      - constants/**
      - hooks/**
      - lib/**
      - scripts/**
      - app.config.ts
      - babel.config.js
      - metro.config.js
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - build_inputs/BioSonify-FIXED-TRIGGER.txt
      - .github/workflows/build-biosonify-v27-native.yml
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - assets/**
      - components/**
      - constants/**
      - hooks/**
      - lib/**
      - scripts/**
      - app.config.ts
      - babel.config.js
      - metro.config.js
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - build_inputs/BioSonify-FIXED-TRIGGER.txt
      - .github/workflows/build-biosonify-v27-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'
      APP_PACKAGE: 'com.app.image.sonification.biofield.app'

    steps:
      - name: Check out real BioSonify source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'
          run_install: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check application
        run: pnpm run check

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --clean

      - name: Build standalone release APK with embedded JS
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify bundled standalone APK and hash it
        run: |
          set -euxo pipefail
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk BioSonify-STANDALONE-OneClick.apk
          unzip -l BioSonify-STANDALONE-OneClick.apk | grep 'assets/index.android.bundle'
          unzip -l BioSonify-STANDALONE-OneClick.apk | grep 'lib/arm64-v8a/libreactnative.so'
          sha256sum BioSonify-STANDALONE-OneClick.apk > BioSonify-STANDALONE-OneClick-SHA256.txt

      - name: Android launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            adb install -r BioSonify-STANDALONE-OneClick.apk
            adb logcat -c
            adb shell am force-stop "$APP_PACKAGE"
            adb shell monkey -p "$APP_PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 12
            PID="$(adb shell pidof "$APP_PACKAGE" | tr -d '\r' || true)"
            echo "BioSonify PID after launch: $PID"
            if [ -z "$PID" ]; then
              echo 'BioSonify died during launch. Recent fatal logs:'
              adb logcat -d -v color | grep -E -i 'FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|SoLoader|hermes|Unable to start activity|com.app.image.sonification.biofield.app' | tail -n 250 || true
              exit 1
            fi
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tail -n 5 || true
            adb logcat -d -v color | grep -E -i 'FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|SoLoader|hermes|com.app.image.sonification.biofield.app' | tail -n 150 || true

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: BioSonify-STANDALONE-OneClick
          path: |
            BioSonify-STANDALONE-OneClick.apk
            BioSonify-STANDALONE-OneClick-SHA256.txt
          if-no-files-found: error
          retention-days: 30
